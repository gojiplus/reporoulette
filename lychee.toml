# Patterns are written without a scheme: preen's links check scans this file
# too, and a pattern with one would be extracted and checked as a link.
exclude = [
  # Test fixtures and API endpoints the tests mock; not links anyone follows.
  '//github\.com/test-owner/test-repo',
  '//api\.github\.com/x',
  '//api\.github\.com/repos/test-owner/test-repo',
  '//api\.github\.com/search/repositories',
]
