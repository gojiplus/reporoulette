[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[project]
name = "reporoulette"
version = "0.6.0"
description = "Random sampling of GitHub repositories using multiple methods"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Gaurav Sood", email = "gsood07@gmail.com"}
]
keywords = [
    "github",
    "repository",
    "sampling",
    "random",
    "research",
    "data-collection",
    "bigquery",
    "git"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
bigquery = [
    "google-cloud-bigquery>=2.0.0",
    "google-auth>=1.30.0",
]
all = []  # Install with: pip install reporoulette[bigquery]

[project.urls]
"Homepage" = "https://github.com/gojiplus/reporoulette"
"Repository" = "https://github.com/gojiplus/reporoulette"
"Bug Tracker" = "https://github.com/gojiplus/reporoulette/issues"
"Documentation" = "https://gojiplus.github.io/reporoulette/"
"Changelog" = "https://github.com/gojiplus/reporoulette/releases"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Canon CI runs plain `uv run pytest`, so the default run must stay offline:
# integration tests hit live BigQuery and are opt-in via `-m integration`.
addopts = [
    "--strict-markers",
    "--strict-config",
    '-m not integration',
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF", "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY", "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF", "PL"]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# PT009/PT019: the suite is written unittest.TestCase-style throughout;
# migrating ~180 assertions to bare pytest asserts is a separate refactor.
"tests/**" = ["S101", "D", "ARG", "SLF", "PLR2004", "PLC0415", "PT009", "PT019"]
"docs/**" = ["D"]
# Maintenance CLI scripts: print is their output channel (T20), they
# deliberately exercise sampler internals (SLF), and magic numbers and long
# branchy mains are their nature.
"scripts/*" = ["D", "T20", "SLF", "PLR2004", "PLC0415", "PLR0912", "PLR0915"]
# Samplers wrap paginated remote APIs behind one call: many tuning knobs
# (PLR0913/PLR0917) and retry/branch-heavy loops (PLR0912/PLR0915) are the
# architecture, not an accident. S311: `random` is the point here —
# reproducible statistical sampling (seeded), not cryptography.
"src/reporoulette/samplers/*" = [
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "S311",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
docs = [
    "sphinx>=4.0.0",
    "furo>=2023.0.0",
    "myst-parser>=0.15.0",
    "sphinx-copybutton",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.390",
    "pre-commit>=4",
    { include-group = "test" },
]
test = ["pytest>=8", "pytest-cov>=6"]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "reporoulette"

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test", "docs"]

[tool.deptry.per_rule_ignores]
DEP004 = ["google"]  # Google Cloud is an optional dependency with try/except imports

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'
require-return-section-when-returning-nothing = false
arg-type-hints-in-signature = true
check-yield-types = false
skip-checking-raises = true

[tool.coverage.run]
source = ["src"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/node_modules",
    "**/.venv",
    "**/venv",
    "build",
    "dist",
    "docs/_build"
]
ignore = ["tests"]
pythonVersion = "3.12"
pythonPlatform = "All"
useLibraryCodeForTypes = true
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportUndefinedVariable = "error"
reportAssertAlwaysTrue = "error"
reportInvalidStringEscapeSequence = "error"
reportInvalidTypeVarUse = "error"
reportSelfClsParameterName = "warning"
reportUnsupportedDunderAll = "warning"
reportUnusedExpression = "warning"
reportWildcardImportFromLibrary = "warning"
reportOptionalSubscript = "error"
reportOptionalMemberAccess = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalContextManager = "error"
reportOptionalOperand = "error"
reportTypedDictNotRequiredAccess = "error"
reportPrivateImportUsage = "error"
reportUnknownArgumentType = "warning"
reportUnknownLambdaType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportInvalidTypeForm = "error"
reportUnnecessaryIsInstance = "warning"
reportUnnecessaryCast = "warning"
reportUnnecessaryComparison = "warning"
reportUnnecessaryContains = "warning"
reportImplicitStringConcatenation = "none"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportOverlappingOverload = "error"
reportPossiblyUnboundVariable = "error"
reportCallInDefaultInitializer = "warning"
reportUnnecessaryTypeIgnoreComment = "warning"
reportImportCycles = "error"
reportPropertyTypeMismatch = "error"
