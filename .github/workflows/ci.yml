name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: reporoulette
      # The canon default matrix starts at the fleet's 3.11 floor, but this
      # project declares requires-python >=3.12; keep in step with the
      # Programming Language classifiers in pyproject.toml.
      python-versions: '["3.12", "3.13", "3.14"]'
      # Measured 77.5% on adoption; a point of slack absorbs ordinary churn.
      coverage-floor: 76
      run-preen: true
